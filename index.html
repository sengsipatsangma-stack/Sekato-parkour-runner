<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sekato Parkour Runner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #70c5ce;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .hud-card {
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid #ff4500;
            border-radius: 12px;
            padding: 8px 16px;
            color: #333;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
        }
        .hud-card span {
            color: #ff4500;
        }
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            background: rgba(15, 25, 40, 0.90);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            pointer-events: auto;
        }
        .modal-title {
            color: #ff4500;
            font-size: 36px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 69, 0, 0.6);
            text-align: center;
        }
        .subtitle {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }
        .character-select {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        .char-card {
            background: #222a38;
            border: 3px solid #444;
            border-radius: 14px;
            padding: 15px 20px;
            width: 140px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .char-card.selected {
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.6);
            transform: scale(1.08);
            background: #283850;
        }
        .char-icon {
            font-size: 40px;
            margin-bottom: 5px;
        }
        .char-name {
            color: #fff;
            font-weight: bold;
            font-size: 16px;
        }
        .btn {
            background: linear-gradient(45deg, #ff4500, #ff8700);
            border: none;
            border-radius: 30px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            padding: 14px 45px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 69, 0, 0.5);
            transition: transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-revive {
            background: linear-gradient(45deg, #00b0ff, #00e676);
            box-shadow: 0 5px 20px rgba(0, 230, 118, 0.5);
            margin-bottom: 12px;
        }
        #high-score-badge {
            color: #ffcc00;
            font-size: 22px;
            margin: 10px 0;
            display: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud" id="game-hud" style="display: none;">
            <div class="hud-card">🏃 <span id="dist-val">0.0</span> km</div>
            <div class="hud-card">🪙 <span id="coin-val">0</span></div>
        </div>
    </div>

    <!-- MAIN MENU (3D LOBBY) -->
    <div id="menu-screen" class="modal">
        <div class="modal-title">SEKATO RUNNER</div>
        <div class="subtitle">Select Your Hero & Start Parkour</div>
        
        <div class="character-select">
            <div class="char-card selected" id="card-sekato" onclick="selectChar('Sekato')">
                <div class="char-icon">🔥</div>
                <div class="char-name">SEKATO</div>
            </div>
            <div class="char-card" id="card-aika" onclick="selectChar('Aika')">
                <div class="char-icon">⚡</div>
                <div class="char-name">AIKA</div>
            </div>
        </div>

        <button class="btn" onclick="startGame()">START RUN</button>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="gameover-screen" class="modal" style="display: none;">
        <div class="modal-title" style="color: #ff1744;">GAME OVER</div>
        <div id="high-score-badge">🏆 NEW HIGH SCORE! 👍😉</div>
        <div class="subtitle" id="final-stats">Distance: 0.0 km | Coins: 0</div>

        <button class="btn btn-revive" id="revive-btn" onclick="reviveRun()">REVIVE (20 🪙)</button>
        <button class="btn" style="background: #333; box-shadow: none;" onclick="restartToMenu()">MAIN MENU</button>
    </div>

    <script>
        let scene, camera, renderer;
        let playerGroup;
        let leftArm, rightArm, leftLeg, rightLeg;
        let selectedCharacter = 'Sekato';
        let gameState = 'MENU';

        let currentLane = 1;
        const laneX = [-3.2, 0, 3.2];
        let forwardSpeed = 0.38;
        const maxSpeed = 0.88;
        let distanceTraveled = 0;
        let coinsCollected = 0;
        let reviveCost = 20;

        let isJumping = false;
        let isSliding = false;
        let verticalVelocity = 0;
        const gravity = -0.022;
        const jumpPower = 0.34;

        let trackTiles = [];
        let obstacles = [];
        let coins = [];
        let runAnimTime = 0;

        let touchStartX = 0;
        let touchStartY = 0;

        function initEngine() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x70c5ce);
            scene.fog = new THREE.FogExp2(0x70c5ce, 0.007);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffeedd, 1.1);
            dirLight.position.set(20, 40, -20);
            scene.add(dirLight);

            playerGroup = new THREE.Group();
            scene.add(playerGroup);
            buildHumanoidCharacter();

            for (let i = 0; i < 14; i++) {
                spawnTrackTile(i * 20);
            }

            setupCameraForLobby();

            // Controls setup
            window.addEventListener('resize', onWindowResize);
            
            window.addEventListener('touchstart', e => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, {passive: true});

            window.addEventListener('touchend', e => {
                if (gameState !== 'PLAYING') return;
                let dx = e.changedTouches[0].clientX - touchStartX;
                let dy = e.changedTouches[0].clientY - touchStartY;
                
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx < -25 && currentLane < 2) currentLane++;      
                    else if (dx > 25 && currentLane > 0) currentLane--;  
                } else {
                    if (dy < -25 && !isJumping && !isSliding) { 
                        isJumping = true; 
                        verticalVelocity = jumpPower; 
                    } else if (dy > 25 && !isSliding && !isJumping) { 
                        triggerSlide(); 
                    }
                }
            }, {passive: true});

            window.addEventListener('keydown', e => {
                if (gameState !== 'PLAYING') return;
                if ((e.key === 'ArrowLeft' || e.key === 'a') && currentLane > 0) currentLane--;
                if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 2) currentLane++;
                if ((e.key === 'ArrowUp' || e.key === 'w') && !isJumping && !isSliding) { 
                    isJumping = true; 
                    verticalVelocity = jumpPower; 
                }
                if ((e.key === 'ArrowDown' || e.key === 's') && !isSliding && !isJumping) { 
                    triggerSlide(); 
                }
            });

            animate();
        }

        // --- HIGH-DETAIL HUMANOID CHARACTER ---
        function buildHumanoidCharacter() {
            while (playerGroup.children.length > 0) {
                playerGroup.remove(playerGroup.children[0]);
            }

            const isSekato = selectedCharacter === 'Sekato';
            const skinMat = new THREE.MeshLambertMaterial({ color: 0xffccaa });
            const blueMat = new THREE.MeshLambertMaterial({ color: 0x0055ff });
            const redMat = new THREE.MeshLambertMaterial({ color: 0xff2200 });
            const darkMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
            const hairMat = new THREE.MeshLambertMaterial({ color: isSekato ? 0xffffff : 0x111111 });
            const shoeMat = new THREE.MeshLambertMaterial({ color: 0xeeeeee });

            // Torso / Split Hoodie
            const torsoGroup = new THREE.Group();
            
            if (isSekato) {
                // Split Hoodie (Blue Left, Red Right)
                const leftBodyGeo = new THREE.BoxGeometry(0.38, 0.95, 0.45);
                const leftBody = new THREE.Mesh(leftBodyGeo, blueMat);
                leftBody.position.set(-0.19, 1.25, 0);
                torsoGroup.add(leftBody);

                const rightBodyGeo = new THREE.BoxGeometry(0.38, 0.95, 0.45);
                const rightBody = new THREE.Mesh(rightBodyGeo, redMat);
                rightBody.position.set(0.19, 1.25, 0);
                torsoGroup.add(rightBody);
            } else {
                // Aika - Sleek Black Cropped Hoodie
                const cropGeo = new THREE.BoxGeometry(0.72, 0.65, 0.42);
                const crop = new THREE.Mesh(cropGeo, darkMat);
                crop.position.set(0, 1.4, 0);
                torsoGroup.add(crop);

                // Midriff
                const midGeo = new THREE.BoxGeometry(0.65, 0.3, 0.38);
                const mid = new THREE.Mesh(midGeo, skinMat);
                mid.position.set(0, 0.95, 0);
                torsoGroup.add(mid);
            }
            playerGroup.add(torsoGroup);

            // Head & Facial Features
            const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const head = new THREE.Mesh(headGeo, skinMat);
            head.position.y = 1.95;
            
            // Eye details
            const eyeGeo = new THREE.BoxGeometry(0.1, 0.1, 0.05);
            const eyeMat = new THREE.MeshLambertMaterial({ color: isSekato ? 0x0088ff : 0x222222 });
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.14, 0.05, 0.25);
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.14, 0.05, 0.25);
            head.add(leftEye);
            head.add(rightEye);

            // Sekato Face Markings
            if (isSekato) {
                const markGeo = new THREE.BoxGeometry(0.08, 0.2, 0.06);
                const markMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
                const m1 = new THREE.Mesh(markGeo, markMat);
                m1.position.set(0, 0.15, 0.25);
                head.add(m1);
            }

            playerGroup.add(head);

            // Hair Setup
            if (isSekato) {
                for (let i = 0; i < 5; i++) {
                    const spikeGeo = new THREE.ConeGeometry(0.18, 0.4, 4);
                    const spike = new THREE.Mesh(spikeGeo, hairMat);
                    spike.position.set((i - 2) * 0.12, 2.3, (Math.random() - 0.5) * 0.2);
                    playerGroup.add(spike);
                }
            } else {
                const hairTopGeo = new THREE.BoxGeometry(0.56, 0.3, 0.56);
                const hairTop = new THREE.Mesh(hairTopGeo, hairMat);
                hairTop.position.set(0, 2.1, 0);
                playerGroup.add(hairTop);

                // Dynamic Ponytail
                const tailGeo = new THREE.ConeGeometry(0.2, 0.6, 5);
                const tail = new THREE.Mesh(tailGeo, hairMat);
                tail.rotation.x = -Math.PI / 3;
                tail.position.set(0, 2.0, -0.4);
                playerGroup.add(tail);
            }

            // Arms
            const armGeo = new THREE.BoxGeometry(0.22, 0.75, 0.22);
            leftArm = new THREE.Mesh(armGeo, isSekato ? blueMat : darkMat);
            leftArm.position.set(-0.52, 1.25, 0);
            playerGroup.add(leftArm);

            rightArm = new THREE.Mesh(armGeo, isSekato ? redMat : darkMat);
            rightArm.position.set(0.52, 1.25, 0);
            playerGroup.add(rightArm);

            // Legs & Shoes
            const legGeo = new THREE.BoxGeometry(0.24, 0.7, 0.24);
            leftLeg = new THREE.Mesh(legGeo, darkMat);
            leftLeg.position.set(-0.2, 0.45, 0);
            
            const shoeGeo = new THREE.BoxGeometry(0.26, 0.2, 0.4);
            const leftShoe = new THREE.Mesh(shoeGeo, shoeMat);
            leftShoe.position.set(0, -0.35, 0.08);
            leftLeg.add(leftShoe);
            playerGroup.add(leftLeg);

            rightLeg = new THREE.Mesh(legGeo, darkMat);
            rightLeg.position.set(0.2, 0.45, 0);

            const rightShoe = new THREE.Mesh(shoeGeo, shoeMat);
            rightShoe.position.set(0, -0.35, 0.08);
            rightLeg.add(rightShoe);
            playerGroup.add(rightLeg);
        }

        function selectChar(name) {
            selectedCharacter = name;
            document.getElementById('card-sekato').classList.toggle('selected', name === 'Sekato');
            document.getElementById('card-aika').classList.toggle('selected', name === 'Aika');
            buildHumanoidCharacter();
        }

        function setupCameraForLobby() {
            camera.position.set(0, 2.2, -4.2);
            camera.lookAt(0, 1.4, 0);
            playerGroup.position.set(0, 0, 0);
            playerGroup.rotation.y = Math.PI;
        }

        function setupCameraForGame() {
            playerGroup.rotation.y = 0;
        }

        function spawnTrackTile(zPos) {
            const tileGroup = new THREE.Group();
            
            const geo = new THREE.BoxGeometry(11, 2, 20);
            const mat = new THREE.MeshLambertMaterial({ color: 0xdcd6d0 });
            const tile = new THREE.Mesh(geo, mat);
            tile.position.set(0, -1, zPos + 10);
            tileGroup.add(tile);

            const colors = [0xff7b7b, 0xffd166, 0x06d6a0, 0x118ab2, 0x8338ec, 0xff595e, 0x3a86ff];
            for (let side = -1; side <= 1; side += 2) {
                const bHeight = 18 + Math.random() * 22;
                const bGeo = new THREE.BoxGeometry(12, bHeight, 20);
                const colorChoice = colors[Math.floor(Math.random() * colors.length)];
                const bMat = new THREE.MeshLambertMaterial({ color: colorChoice });
                const building = new THREE.Mesh(bGeo, bMat);
                building.position.set(side * 11.5, (bHeight / 2) - 2, zPos + 10);
                tileGroup.add(building);

                const decGeo = new THREE.BoxGeometry(12.2, 1.2, 3);
                const decMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
                const decor = new THREE.Mesh(decGeo, decMat);
                decor.position.set(side * 11.4, 1.0, zPos + 10);
                tileGroup.add(decor);
            }

            scene.add(tileGroup);
            trackTiles.push({ group: tileGroup, z: zPos });

            if (zPos > 30) {
                if (Math.random() > 0.3) spawnObstacle(zPos + 10);
                if (Math.random() > 0.4) spawnCoins(zPos + 10);
            }
        }

        function spawnObstacle(zPos) {
            const lane = Math.floor(Math.random() * 3);
            const isTall = Math.random() > 0.5;
            
            const obsGroup = new THREE.Group();

            if (isTall) {
                // TALL Construction Barricade
                const barGeo = new THREE.BoxGeometry(2.4, 1.6, 0.4);
                const barMat = new THREE.MeshLambertMaterial({ color: 0xffaa00 });
                const bar = new THREE.Mesh(barGeo, barMat);
                bar.position.y = 0.8;
                obsGroup.add(bar);

                const stripeGeo = new THREE.BoxGeometry(2.45, 0.3, 0.42);
                const stripeMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
                const s1 = new THREE.Mesh(stripeGeo, stripeMat);
                s1.position.y = 1.2;
                const s2 = new THREE.Mesh(stripeGeo, stripeMat);
                s2.position.y = 0.4;
                obsGroup.add(s1);
                obsGroup.add(s2);

                obsGroup.position.set(laneX[lane], 0, zPos);
                obsGroup.userData = { type: 'tall', depth: 0.4 };
            } else {
                // EXTENDED LONG SLIDE ROADBLOCK (Must perform a low slide roll under)
                const longDepth = 8.0; // Extra long tunnel structure
                const lowGeo = new THREE.BoxGeometry(2.6, 0.8, longDepth);
                const lowMat = new THREE.MeshLambertMaterial({ color: 0xff3344 });
                const lowBar = new THREE.Mesh(lowGeo, lowMat);
                lowBar.position.y = 1.6; // High overhead canopy requiring roll
                obsGroup.add(lowBar);

                // Structural Support Pillars
                const poleGeo = new THREE.CylinderGeometry(0.12, 0.12, 1.6);
                const poleMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
                
                for (let pz of [-3.5, 3.5]) {
                    const p1 = new THREE.Mesh(poleGeo, poleMat);
                    p1.position.set(-1.2, 0.8, pz);
                    const p2 = new THREE.Mesh(poleGeo, poleMat);
                    p2.position.set(1.2, 0.8, pz);
                    obsGroup.add(p1);
                    obsGroup.add(p2);
                }

                obsGroup.position.set(laneX[lane], 0, zPos);
                obsGroup.userData = { type: 'low', depth: longDepth };
            }

            scene.add(obsGroup);
            obstacles.push(obsGroup);
        }

        function spawnCoins(zPos) {
            const lane = Math.floor(Math.random() * 3);
            for (let i = 0; i < 4; i++) {
                const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 12);
                const mat = new THREE.MeshLambertMaterial({ color: 0xffd700 });
                const coin = new THREE.Mesh(geo, mat);
                coin.rotation.x = Math.PI / 2;
                coin.position.set(laneX[lane], 1.2, zPos + (i * 2.2));
                scene.add(coin);
                coins.push(coin);
            }
        }

        function triggerSlide() {
            isSliding = true;
            playerGroup.scale.set(1, 0.35, 1); // Full low roll pose
            setTimeout(() => {
                playerGroup.scale.set(1, 1, 1);
                isSliding = false;
            }, 850);
        }

        function startGame() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-hud').style.display = 'flex';
            gameState = 'PLAYING';
            distanceTraveled = 0;
            coinsCollected = 0;
            forwardSpeed = 0.38;
            currentLane = 1;
            reviveCost = 20;
            playerGroup.position.set(0, 0, 0);
            setupCameraForGame();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameState === 'MENU') {
                playerGroup.rotation.y += 0.01;
            } else if (gameState === 'PLAYING') {
                forwardSpeed = Math.min(forwardSpeed + 0.0001, maxSpeed);
                distanceTraveled += forwardSpeed * 0.1;

                document.getElementById('dist-val').innerText = distanceTraveled.toFixed(1);
                document.getElementById('coin-val').innerText = coinsCollected;

                const targetX = laneX[currentLane];
                playerGroup.position.x += (targetX - playerGroup.position.x) * 0.4;

                if (isJumping) {
                    playerGroup.position.y += verticalVelocity;
                    verticalVelocity += gravity;
                    if (playerGroup.position.y <= 0) {
                        playerGroup.position.y = 0;
                        isJumping = false;
                    }
                }

                playerGroup.position.z += forwardSpeed;

                runAnimTime += forwardSpeed * 1.1;
                if (leftArm && rightArm && leftLeg && rightLeg && !isJumping) {
                    leftArm.rotation.x = Math.sin(runAnimTime) * 0.75;
                    rightArm.rotation.x = -Math.sin(runAnimTime) * 0.75;
                    leftLeg.rotation.x = -Math.sin(runAnimTime) * 0.85;
                    rightLeg.rotation.x = Math.sin(runAnimTime) * 0.85;
                }

                camera.position.z = playerGroup.position.z - 7.5;
                camera.position.y = 4.2;
                camera.position.x = playerGroup.position.x * 0.35;
                camera.lookAt(playerGroup.position.x * 0.2, 1.6, playerGroup.position.z + 7);

                const lastTileZ = trackTiles[trackTiles.length - 1].z;
                if (playerGroup.position.z > lastTileZ - 180) {
                    spawnTrackTile(lastTileZ + 20);
                }

                coins.forEach(coin => {
                    coin.rotation.z += 0.08;
                    if (coin.position.distanceTo(playerGroup.position) < 2.0) {
                        scene.remove(coin);
                        coinsCollected++;
                    }
                });

                obstacles.forEach(obs => {
                    const depth = obs.userData.depth || 0.4;
                    if (Math.abs(obs.position.z - playerGroup.position.z) < (depth / 2 + 0.5) &&
                        Math.abs(obs.position.x - playerGroup.position.x) < 1.1) {
                        
                        if (obs.userData.type === 'tall') {
                            triggerGameOver();
                        } else if (obs.userData.type === 'low' && !isSliding) {
                            triggerGameOver();
                        }
                    }
                });
            }

            renderer.render(scene, camera);
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';

            const highScore = parseFloat(localStorage.getItem('SekatoHighScore') || '0');
            const isNewHigh = distanceTraveled > highScore;
            if (isNewHigh) {
                localStorage.setItem('SekatoHighScore', distanceTraveled.toFixed(1));
            }

            document.getElementById('high-score-badge').style.display = isNewHigh ? 'block' : 'none';
            document.getElementById('final-stats').innerText = `Distance: ${distanceTraveled.toFixed(1)} km | Coins: ${coinsCollected}`;
            document.getElementById('revive-btn').innerText = `REVIVE (${reviveCost} 🪙)`;
            document.getElementById('gameover-screen').style.display = 'flex';
        }

        function reviveRun() {
            if (coinsCollected >= reviveCost) {
                coinsCollected -= reviveCost;
                reviveCost *= 2;
                gameState = 'PLAYING';
                playerGroup.position.z += 6;
                document.getElementById('gameover-screen').style.display = 'none';
            } else {
                alert("Not enough coins!");
            }
        }

        function restartToMenu() {
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('game-hud').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'flex';
            gameState = 'MENU';
            buildHumanoidCharacter();
            setupCameraForLobby();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = initEngine;
    </script>
</body>
</html>
