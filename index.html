<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sekato Parkour Runner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #70c5ce;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .hud-card {
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid #ff4500;
            border-radius: 12px;
            padding: 8px 16px;
            color: #333;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
        }
        .hud-card span {
            color: #ff4500;
        }
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            background: rgba(15, 25, 40, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            pointer-events: auto;
        }
        .modal-title {
            color: #ff4500;
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 69, 0, 0.6);
            text-align: center;
        }
        .subtitle {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
        }
        .character-select {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .char-card {
            background: #222a38;
            border: 2px solid #444;
            border-radius: 12px;
            padding: 15px;
            width: 130px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .char-card.selected {
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 200, 0.5);
            transform: scale(1.05);
        }
        .char-icon {
            font-size: 38px;
            margin-bottom: 5px;
        }
        .char-name {
            color: #fff;
            font-weight: bold;
            font-size: 16px;
        }
        .btn {
            background: linear-gradient(45deg, #ff4500, #ff8700);
            border: none;
            border-radius: 30px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            padding: 14px 40px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 69, 0, 0.5);
        }
        .btn-revive {
            background: linear-gradient(45deg, #00b0ff, #00e676);
            box-shadow: 0 5px 20px rgba(0, 230, 118, 0.5);
            margin-bottom: 12px;
        }
        #high-score-badge {
            color: #ffcc00;
            font-size: 22px;
            margin: 10px 0;
            display: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud">
            <div class="hud-card">🏃 <span id="dist-val">0.0</span> km</div>
            <div class="hud-card">🪙 <span id="coin-val">0</span></div>
        </div>
    </div>

    <!-- MAIN MENU -->
    <div id="menu-screen" class="modal">
        <div class="modal-title">SEKATO RUNNER</div>
        <div class="subtitle">3D Cartoon Town Parkour</div>
        
        <div class="character-select">
            <div class="char-card selected" id="card-sekato" onclick="selectChar('Sekato')">
                <div class="char-icon">🔥</div>
                <div class="char-name">SEKATO</div>
            </div>
            <div class="char-card" id="card-aika" onclick="selectChar('Aika')">
                <div class="char-icon">⚡</div>
                <div class="char-name">AIKA</div>
            </div>
        </div>

        <button class="btn" onclick="startGame()">START RUN</button>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="gameover-screen" class="modal" style="display: none;">
        <div class="modal-title" style="color: #ff1744;">GAME OVER</div>
        <div id="high-score-badge">🏆 NEW HIGH SCORE! 👍😉</div>
        <div class="subtitle" id="final-stats">Distance: 0.0 km | Coins: 0</div>

        <button class="btn btn-revive" id="revive-btn" onclick="reviveRun()">REVIVE (20 🪙)</button>
        <button class="btn" style="background: #333; box-shadow: none;" onclick="restartToMenu()">MAIN MENU</button>
    </div>

    <script>
        let scene, camera, renderer;
        let playerGroup, playerMesh;
        let selectedCharacter = 'Sekato';
        let isPlaying = false;
        let isDead = false;

        let currentLane = 1;
        const laneX = [-3.2, 0, 3.2];
        let forwardSpeed = 0.35;
        const maxSpeed = 0.85;
        let distanceTraveled = 0;
        let coinsCollected = 0;
        let reviveCost = 20;

        let isJumping = false;
        let isSliding = false;
        let verticalVelocity = 0;
        const gravity = -0.018;
        const jumpPower = 0.42;

        let trackTiles = [];
        let obstacles = [];
        let coins = [];
        let droneMesh;

        let touchStartX = 0;
        let touchStartY = 0;

        function initEngine() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x70c5ce); // Bright cartoon sky blue
            scene.fog = new THREE.FogExp2(0x70c5ce, 0.008);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(0, 4.5, -8);
            camera.lookAt(0, 1.5, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffeedd, 1.0);
            dirLight.position.set(20, 40, -20);
            scene.add(dirLight);

            playerGroup = new THREE.Group();
            scene.add(playerGroup);
            buildPlayerMesh();

            // Flying Drone Enemy
            const droneGeo = new THREE.ConeGeometry(0.8, 1.2, 4);
            const droneMat = new THREE.MeshLambertMaterial({ color: 0xff0055 });
            droneMesh = new THREE.Mesh(droneGeo, droneMat);
            droneMesh.rotation.x = Math.PI;
            scene.add(droneMesh);

            for (let i = 0; i < 14; i++) {
                spawnTrackTile(i * 20);
            }

            // Controls Setup
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('touchstart', e => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
            window.addEventListener('touchend', e => {
                let dx = e.changedTouches[0].clientX - touchStartX;
                let dy = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx < -30 && currentLane < 2) currentLane++;      
                    else if (dx > 30 && currentLane > 0) currentLane--;  
                } else {
                    if (dy < -30 && !isJumping) { isJumping = true; verticalVelocity = jumpPower; }
                    else if (dy > 30 && !isSliding) { triggerSlide(); }
                }
            });

            window.addEventListener('keydown', e => {
                if (!isPlaying || isDead) return;
                if ((e.key === 'ArrowLeft' || e.key === 'a') && currentLane > 0) currentLane--;
                if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 2) currentLane++;
                if ((e.key === 'ArrowUp' || e.key === 'w') && !isJumping) { isJumping = true; verticalVelocity = jumpPower; }
                if ((e.key === 'ArrowDown' || e.key === 's') && !isSliding) { triggerSlide(); }
            });

            animate();
        }

        function createCharacterTexture(name) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            if (name === 'Sekato') {
                ctx.clearRect(0, 0, 256, 512);
                ctx.fillStyle = '#0066ff'; 
                ctx.fillRect(40, 220, 88, 200);
                ctx.fillStyle = '#ff2200'; 
                ctx.fillRect(128, 220, 88, 200);
                ctx.fillStyle = '#111111';
                ctx.fillRect(70, 420, 116, 80);
                ctx.fillStyle = '#ffccaa';
                ctx.beginPath();
                ctx.arc(128, 140, 45, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#111';
                ctx.fillRect(118, 105, 20, 35); 
                ctx.fillRect(95, 135, 15, 25);  
                ctx.fillRect(146, 135, 15, 25); 
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(70, 130);
                ctx.lineTo(128, 70);
                ctx.lineTo(186, 130);
                ctx.lineTo(170, 90);
                ctx.lineTo(128, 50);
                ctx.lineTo(86, 90);
                ctx.closePath();
                ctx.fill();
            } else {
                ctx.clearRect(0, 0, 256, 512);
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(50, 240, 156, 150);
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(128, 295, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#111';
                ctx.fillRect(75, 390, 106, 70);
                ctx.fillStyle = '#ffccaa';
                ctx.fillRect(85, 460, 35, 50);
                ctx.fillRect(136, 460, 35, 50);
                ctx.fillStyle = '#ffccaa';
                ctx.beginPath();
                ctx.arc(128, 140, 42, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.arc(128, 125, 45, Math.PI, Math.PI * 2);
                ctx.fill();
                ctx.fillRect(160, 100, 30, 60);
            }
            return new THREE.CanvasTexture(canvas);
        }

        function buildPlayerMesh() {
            if (playerMesh) playerGroup.remove(playerMesh);
            const texture = createCharacterTexture(selectedCharacter);
            const mat = new THREE.SpriteMaterial({ map: texture });
            playerMesh = new THREE.Sprite(mat);
            playerMesh.scale.set(2.2, 3.8, 1);
            playerMesh.position.y = 1.9;
            playerGroup.add(playerMesh);
        }

        function selectChar(name) {
            selectedCharacter = name;
            document.getElementById('card-sekato').classList.toggle('selected', name === 'Sekato');
            document.getElementById('card-aika').classList.toggle('selected', name === 'Aika');
            buildPlayerMesh();
        }

        function spawnTrackTile(zPos) {
            const tileGroup = new THREE.Group();
            
            // Paved Town Street / Rooftop Path
            const geo = new THREE.BoxGeometry(11, 2, 20);
            const mat = new THREE.MeshLambertMaterial({ color: 0xdcd6d0 });
            const tile = new THREE.Mesh(geo, mat);
            tile.position.set(0, -1, zPos + 10);
            tileGroup.add(tile);

            // Colorful Cartoon Town Buildings[span_6](start_span)[span_6](end_span) on both sides
            const colors = [0xff7b7b, 0xffd166, 0x06d6a0, 0x118ab2, 0x8338ec];
            for (let side = -1; side <= 1; side += 2) {
                const bHeight = 16 + Math.random() * 18;
                const bGeo = new THREE.BoxGeometry(12, bHeight, 20);
                const colorChoice = colors[Math.floor(Math.random() * colors.length)];
                const bMat = new THREE.MeshLambertMaterial({ color: colorChoice });
                const building = new THREE.Mesh(bGeo, bMat);
                building.position.set(side * 11.5, (bHeight / 2) - 2, zPos + 10);
                tileGroup.add(building);
            }

            scene.add(tileGroup);
            trackTiles.push({ group: tileGroup, z: zPos });

            if (zPos > 30) {
                if (Math.random() > 0.3) spawnObstacle(zPos + 10);
                if (Math.random() > 0.4) spawnCoins(zPos + 10);
            }
        }

        function spawnObstacle(zPos) {
            const lane = Math.floor(Math.random() * 3);
            const isTall = Math.random() > 0.5;
            
            const obsGroup = new THREE.Group();

            if (isTall) {
                // Construction Barrier Barricade Fence (Yellow & Black stripes)[span_7](start_span)[span_7](end_span)[span_8](start_span)[span_8](end_span)
                const barGeo = new THREE.BoxGeometry(2.4, 0.8, 0.4);
                const barMat = new THREE.MeshLambertMaterial({ color: 0xffaa00 });
                const bar = new THREE.Mesh(barGeo, barMat);
                bar.position.y = 1.0;
                obsGroup.add(bar);

                // Side poles
                const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, 1.8);
                const poleMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
                const p1 = new THREE.Mesh(poleGeo, poleMat);
                p1.position.set(-1.1, 0.9, 0);
                const p2 = new THREE.Mesh(poleGeo, poleMat);
                p2.position.set(1.1, 0.9, 0);
                obsGroup.add(p1);
                obsGroup.add(p2);

                obsGroup.position.set(laneX[lane], 0, zPos);
                obsGroup.userData = { type: 'tall' };
            } else {
                // Low roadblock barrier
                const lowGeo = new THREE.BoxGeometry(2.6, 0.5, 0.4);
                const lowMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
                const lowBar = new THREE.Mesh(lowGeo, lowMat);
                lowBar.position.y = 0.25;
                obsGroup.add(lowBar);

                obsGroup.position.set(laneX[lane], 1.8, zPos); // Placed overhead for sliding under
                obsGroup.userData = { type: 'low' };
            }

            scene.add(obsGroup);
            obstacles.push(obsGroup);
        }

        function spawnCoins(zPos) {
            const lane = Math.floor(Math.random() * 3);
            for (let i = 0; i < 4; i++) {
                const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 10);
                const mat = new THREE.MeshLambertMaterial({ color: 0xffd700 });
                const coin = new THREE.Mesh(geo, mat);
                coin.rotation.x = Math.PI / 2;
                coin.position.set(laneX[lane], 1.2, zPos + (i * 2.2));
                scene.add(coin);
                coins.push(coin);
            }
        }

        function triggerSlide() {
            isSliding = true;
            if (playerMesh) playerMesh.scale.set(2.2, 1.8, 1);
            setTimeout(() => {
                if (playerMesh) playerMesh.scale.set(2.2, 3.8, 1);
                isSliding = false;
            }, 750);
        }

        function startGame() {
            document.getElementById('menu-screen').style.display = 'none';
            isPlaying = true;
            isDead = false;
            distanceTraveled = 0;
            coinsCollected = 0;
            forwardSpeed = 0.35;
            currentLane = 1;
            reviveCost = 20;
            playerGroup.position.set(0, 0, 0);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying && !isDead) {
                forwardSpeed = Math.min(forwardSpeed + 0.0001, maxSpeed);
                distanceTraveled += forwardSpeed * 0.1;

                document.getElementById('dist-val').innerText = distanceTraveled.toFixed(1);
                document.getElementById('coin-val').innerText = coinsCollected;

                const targetX = laneX[currentLane];
                playerGroup.position.x += (targetX - playerGroup.position.x) * 0.25;

                if (isJumping) {
                    playerGroup.position.y += verticalVelocity;
                    verticalVelocity += gravity;
                    if (playerGroup.position.y <= 0) {
                        playerGroup.position.y = 0;
                        isJumping = false;
                    }
                }

                playerGroup.position.z += forwardSpeed;

                camera.position.z = playerGroup.position.z - 8;
                camera.position.x = playerGroup.position.x * 0.3;
                camera.lookAt(playerGroup.position.x * 0.2, 1.5, playerGroup.position.z + 8);

                droneMesh.position.set(playerGroup.position.x, 2.8, playerGroup.position.z - 5);

                const lastTileZ = trackTiles[trackTiles.length - 1].z;
                if (playerGroup.position.z > lastTileZ - 180) {
                    spawnTrackTile(lastTileZ + 20);
                }

                coins.forEach(coin => {
                    coin.rotation.z += 0.05;
                    if (coin.position.distanceTo(playerGroup.position) < 2.2) {
                        scene.remove(coin);
                        coinsCollected++;
                    }
                });

                obstacles.forEach(obs => {
                    if (Math.abs(obs.position.z - playerGroup.position.z) < 1.0 &&
                        Math.abs(obs.position.x - playerGroup.position.x) < 1.2) {
                        
                        if (obs.userData.type === 'tall' && playerGroup.position.y < 1.2) triggerGameOver();
                        if (obs.userData.type === 'low' && !isSliding) triggerGameOver();
                    }
                });
            }

            renderer.render(scene, camera);
        }

        function triggerGameOver() {
            isDead = true;
            isPlaying = false;

            const highScore = parseFloat(localStorage.getItem('SekatoHighScore') || '0');
            const isNewHigh = distanceTraveled > highScore;
            if (isNewHigh) {
                localStorage.setItem('SekatoHighScore', distanceTraveled.toFixed(1));
            }

            document.getElementById('high-score-badge').style.display = isNewHigh ? 'block' : 'none';
            document.getElementById('final-stats').innerText = `Distance: ${distanceTraveled.toFixed(1)} km | Coins: ${coinsCollected}`;
            document.getElementById('revive-btn').innerText = `REVIVE (${reviveCost} 🪙)`;
            document.getElementById('gameover-screen').style.display = 'flex';
        }

        function reviveRun() {
            if (coinsCollected >= reviveCost) {
                coinsCollected -= reviveCost;
                reviveCost *= 2;
                isDead = false;
                isPlaying = true;
                playerGroup.position.z += 5;
                document.getElementById('gameover-screen').style.display = 'none';
            } else {
                alert("Not enough coins!");
            }
        }

        function restartToMenu() {
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'flex';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = initEngine;
    </script>
</body>
</html>
