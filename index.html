<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sekato Parkour Runner</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }
        .interactive {
            pointer-events: auto;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .panel {
            background: rgba(15, 15, 25, 0.9);
            border: 2px solid #00ffcc;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            max-width: 400px;
            width: 90%;
            margin: auto;
        }
        h1 {
            margin-top: 0;
            color: #00ffcc;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        button {
            background: linear-gradient(135deg, #00ffcc, #0099ff);
            border: none;
            color: #000;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 4px 10px rgba(0, 255, 204, 0.3);
        }
        button:active {
            transform: scale(0.95);
        }
        input, select {
            width: 80%;
            padding: 12px;
            margin: 10px 0;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        .leaderboard-list {
            max-height: 150px;
            overflow-y: auto;
            margin: 10px 0;
            text-align: left;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 6px;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }
    </style>

    <!-- Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Firebase SDKs v8.10.1 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

    <div class="ui-layer">
        <!-- HUD TOP -->
        <div id="hud" class="hidden">
            <div>Score: <span id="hud-score">0</span>m</div>
            <div>Coins: 🪙 <span id="hud-coins">0</span></div>
        </div>

        <!-- PROFILE SETUP SCREEN -->
        <div id="screen-profile" class="panel interactive">
            <h1>Sekato Parkour</h1>
            <p>Enter your runner tag to start:</p>
            <input type="text" id="input-username" placeholder="Runner Name" maxlength="12">
            <br>
            <label>Character:</label>
            <select id="select-char">
                <option value="sekato">Sekato (♂)</option>
                <option value="aika">Aika (♀)</option>
            </select>
            <br>
            <button id="btn-start-profile">Enter Game</button>
        </div>

        <!-- MAIN MENU SCREEN -->
        <div id="screen-menu" class="panel interactive hidden">
            <h1>Sekato Parkour</h1>
            <p>Welcome, <span id="display-username">Runner</span>!</p>
            <button id="btn-play">Play Game</button>
            <button id="btn-settings-toggle">Settings</button>
            
            <h3>Global Leaderboard</h3>
            <div id="leaderboard-container" class="leaderboard-list">
                <div class="leaderboard-item"><span>Loading scores...</span></div>
            </div>
        </div>

        <!-- SETTINGS SCREEN -->
        <div id="screen-settings" class="panel interactive hidden">
            <h1>Settings</h1>
            <label style="display:block; margin: 15px 0; cursor: pointer;">
                <input type="checkbox" id="check-inverted" style="width:auto;"> Inverted Steering
            </label>
            <button id="btn-back-menu">Back to Menu</button>
        </div>

        <!-- GAME OVER / REVIVE SCREEN -->
        <div id="screen-gameover" class="panel interactive hidden">
            <h1>Wiped Out!</h1>
            <p>Distance: <span id="go-score">0</span>m</p>
            <button id="btn-revive">Revive (<span id="revive-cost">20</span> Coins)</button>
            <button id="btn-menu-home">Main Menu</button>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIGURATION (Linked to your project) ---
        const firebaseConfig = {
            apiKey: "AIzaSyCMzkmGlDUTGD-GSqz0...", // Replace with your exact full key if needed
            authDomain: "sekato-runner.firebaseapp.com",[span_2](start_span)[span_2](end_span)
            projectId: "sekato-runner",[span_3](start_span)[span_3](end_span)
            storageBucket: "sekato-runner.firebasestorage.app",[span_4](start_span)[span_4](end_span)
            messagingSenderId: "479452830068",[span_5](start_span)[span_5](end_span)
            appId: "1:479452830068:web:4ed6d1...",[span_6](start_span)[span_6](end_span)
            measurementId: "G-R9JHC0TG5F[span_7](start_span)"[span_7](end_span)
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- GAME STATE & STORAGE ---
        const REVIVE_SCHEDULE = [20, 100, 500, 2000, 10000, 50000, 200000, 1000000, 5000000];
        let gameState = {
            username: localStorage.getItem('sekato_user') || '',
            character: localStorage.getItem('sekato_char') || 'sekato',
            coins: parseInt(localStorage.getItem('sekato_coins') || '100'), // Starter coins for testing revives
            inverted: localStorage.getItem('sekato_inv') === 'true',
            reviveCount: 0,
            score: 0,
            alive: false
        };

        // --- AUDIO SYSTEM (Web Audio API with Tab Safety) ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playTone(freq, type, duration) {
            if (!audioCtx || audioCtx.state !== 'running') return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && audioCtx && audioCtx.state === 'running') {
                audioCtx.suspend();
            }
        });

        // --- THREE.JS ENGINE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.FogExp2(0x1a1a2e, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 7);
        camera.lookAt(0, 1, -5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Track & Environment
        const laneWidth = 2.5;
        const trackLength = 120;
        let trackSegments = [];

        function createTrackSegment(zPos) {
            const group = new THREE.Group();
            // Lanes
            for(let i = -1; i <= 1; i++) {
                let color = (i === 0) ? 0x222233 : 0x161622;
                let mesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(laneWidth, trackLength),
                    new THREE.MeshStandardMaterial({ color: color })
                );
                mesh.rotation.x = -Math.PI / 2;
                mesh.position.set(i * laneWidth, 0, zPos);
                group.add(mesh);
            }
            scene.add(group);
            trackSegments.push({ group, z: zPos });
        }
        for(let i = 0; i < 4; i++) createTrackSegment(-i * trackLength);

        // Player Mesh
        const playerGroup = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc });
        const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 0.5), bodyMat);
        bodyMesh.position.y = 0.7;
        playerGroup.add(bodyMesh);
        scene.add(playerGroup);

        let playerLane = 0; // -1: Left, 0: Center, 1: Right
        let playerY = 0;
        let playerVY = 0;
        let isJumping = false;
        let isRolling = false;
        let gameSpeed = 0.5;

        // Obstacles & Coins
        let obstacles = [];
        let coins = [];

        function spawnRow(zPos) {
            // Random obstacle or coin row
            let lane = Math.floor(Math.random() * 3) - 1;
            let type = Math.random();
            if (type < 0.3) {
                // Jump-Only (🧱)
                let obs = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.8, 0.8), new THREE.MeshStandardMaterial({color: 0xff3355}));
                obs.position.set(lane * laneWidth, 0.4, zPos);
                obs.userData = { type: 'jump', lane: lane };
                scene.add(obs);
                obstacles.push(obs);
            } else if (type < 0.6) {
                // Roll-Only (🕳️ / Barrier above)
                let obs = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.2, 0.8), new THREE.MeshStandardMaterial({color: 0xffaa00}));
                obs.position.set(lane * laneWidth, 1.8, zPos);
                obs.userData = { type: 'roll', lane: lane };
                scene.add(obs);
                obstacles.push(obs);
            } else {
                // Coin Row (🪙)
                for(let c = 0; c < 3; c++) {
                    let coin = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16), new THREE.MeshStandardMaterial({color: 0xffd700, metalness: 0.8}));
                    coin.rotation.x = Math.PI / 2;
                    coin.position.set(lane * laneWidth, 0.8, zPos - c * 2);
                    scene.add(coin);
                    coins.push(coin);
                }
            }
        }

        // Controls (Keyboard & Swipe)
        let touchStartX = 0, touchStartY = 0;
        window.addEventListener('keydown', e => {
            if (!gameState.alive) return;
            let dir = gameState.inverted ? -1 : 1;
            if (e.key === 'ArrowLeft' || e.key === 'a') { playerLane = Math.max(-1, playerLane - 1 * dir); playTone(300, 'sine', 0.1); }
            if (e.key === 'ArrowRight' || e.key === 'd') { playerLane = Math.min(1, playerLane + 1 * dir); playTone(400, 'sine', 0.1); }
            if ((e.key === 'ArrowUp' || e.key === 'w') && !isJumping) { playerVY = 0.25; isJumping = true; playTone(600, 'triangle', 0.2); }
            if ((e.key === 'ArrowDown' || e.key === 's') && !isRolling) { isRolling = true; setTimeout(() => isRolling = false, 600); playTone(200, 'sawtooth', 0.2); }
        });

        window.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        window.addEventListener('touchend', e => {
            if (!gameState.alive) return;
            let dx = e.changedTouches[0].clientX - touchStartX;
            let dy = e.changedTouches[0].clientY - touchStartY;
            let dir = gameState.inverted ? -1 : 1;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) { playerLane = Math.min(1, playerLane + 1 * dir); playTone(400, 'sine', 0.1); }
                else if (dx < -30) { playerLane = Math.max(-1, playerLane - 1 * dir); playTone(300, 'sine', 0.1); }
            } else {
                if (dy < -30 && !isJumping) { playerVY = 0.25; isJumping = true; playTone(600, 'triangle', 0.2); }
                else if (dy > 30 && !isRolling) { isRolling = true; setTimeout(() => isRolling = false, 600); playTone(200, 'sawtooth', 0.2); }
            }
        });

        // --- UI & FLOW MANAGEMENT ---
        function showScreen(screenId) {
            ['screen-profile', 'screen-menu', 'screen-settings', 'screen-gameover', 'hud'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
            if(screenId === 'hud') document.getElementById('hud').classList.remove('hidden');
        }

        // Initialize UI values
        if (gameState.username) {
            document.getElementById('input-username').value = gameState.username;
            document.getElementById('display-username').innerText = gameState.username;
            showScreen('screen-menu');
            fetchLeaderboard();
        }

        document.getElementById('btn-start-profile').onclick = () => {
            let name = document.getElementById('input-username').value.trim();
            if (!name) return alert('Please enter a runner name!');
            gameState.username = name;
            gameState.character = document.getElementById('select-char').value;
            localStorage.setItem('sekato_user', gameState.username);
            localStorage.setItem('sekato_char', gameState.character);
            document.getElementById('display-username').innerText = gameState.username;
            showScreen('screen-menu');
            fetchLeaderboard();
        };

        document.getElementById('btn-play').onclick = () => {
            initAudio();
            startGame();
        };

        document.getElementById('btn-settings-toggle').onclick = () => showScreen('screen-settings');
        document.getElementById('btn-back-menu').onclick = () => showScreen('screen-menu');
        document.getElementById('check-inverted').onchange = (e) => {
            gameState.inverted = e.target.checked;
            localStorage.setItem('sekato_inv', gameState.inverted);
        };

        document.getElementById('btn-menu-home').onclick = () => {
            showScreen('screen-menu');
            fetchLeaderboard();
        };

        document.getElementById('btn-revive').onclick = () => {
            let cost = REVIVE_SCHEDULE[Math.min(gameState.reviveCount, REVIVE_SCHEDULE.length - 1)];
            if (gameState.coins >= cost) {
                gameState.coins -= cost;
                gameState.reviveCount++;
                localStorage.setItem('sekato_coins', gameState.coins);
                gameState.alive = true;
                showScreen('hud');
            } else {
                alert('Not enough coins for revive!');
            }
        };

        function startGame() {
            gameState.score = 0;
            gameState.alive = true;
            gameState.reviveCount = 0;
            playerLane = 0;
            playerY = 0;
            isJumping = false;
            isRolling = false;
            
            // Clear old obstacles/coins
            obstacles.forEach(o => scene.remove(o));
            coins.forEach(c => scene.remove(c));
            obstacles = [];
            coins = [];

            // Spawn initial obstacles
            for(let z = -20; z > -300; z -= 30) spawnRow(z);

            showScreen('hud');
        }

        // --- LEADERBOARD CLOUD SYNC ---
        async function submitScore(score, coins) {
            if (!gameState.username) return;
            try {
                const ref = db.collection('leaderboard').doc(gameState.username);
                let doc = await ref.get();
                let bestScore = score;
                if (doc.exists && doc.data().score > score) {
                    bestScore = doc.data().score;
                }
                await ref.set({
                    name: gameState.username,
                    score: bestScore,
                    coins: coins,
                    updated: firebase.firestore.FieldValue.serverTimestamp()
                });
                fetchLeaderboard();
            } catch(e) {
                console.error("Leaderboard sync error:", e);
            }
        }

        async function fetchLeaderboard() {
            try {
                let snapshot = await db.collection('leaderboard').orderBy('score', 'desc').limit(5).get();
                let html = '';
                let rank = 1;
                snapshot.forEach(doc => {
                    let d = doc.data();
                    let medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `${rank}.`;
                    html += `<div class="leaderboard-item"><span>${medal} ${d.name}</span> <span><b>${d.score}</b>m</span></div>`;
                    rank++;
                });
                document.getElementById('leaderboard-container').innerHTML = html || '<div class="leaderboard-item"><span>No scores yet!</span></div>';
            } catch(e) {
                document.getElementById('leaderboard-container').innerHTML = '<div class="leaderboard-item"><span>Connect real Firebase keys to sync!</span></div>';
            }
        }

        // --- GAME LOOP ---
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            if (gameState.alive) {
                gameState.score += Math.floor(gameSpeed * 2);
                document.getElementById('hud-score').innerText = gameState.score;
                document.getElementById('hud-coins').innerText = gameState.coins;

                // Player Physics
                let targetX = playerLane * laneWidth;
                playerGroup.position.x += (targetX - playerGroup.position.x) * 0.2;

                if (isJumping) {
                    playerY += playerVY;
                    playerVY -= 0.015;
                    if (playerY <= 0) { playerY = 0; isJumping = false; }
                }
                playerGroup.position.y = playerY;
                if (isRolling) bodyMesh.scale.set(1, 0.5, 1);
                else bodyMesh.scale.set(1, 1, 1);

                // Move Track & Obstacles
                trackSegments.forEach(seg => {
                    seg.group.position.z += gameSpeed;
                    if (seg.group.position.z > trackLength) {
                        seg.group.position.z -= trackSegments.length * trackLength;
                    }
                });

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += gameSpeed;

                    // Collision Detection
                    if (Math.abs(obs.position.z - playerGroup.position.z) < 0.8 && obs.userData.lane === playerLane) {
                        let hit = false;
                        if (obs.userData.type === 'jump' && playerY < 0.5) hit = true;
                        if (obs.userData.type === 'roll' && !isRolling) hit = true;
                        if (hit) {
                            gameState.alive = false;
                            playTone(100, 'sawtooth', 0.5);
                            document.getElementById('go-score').innerText = gameState.score;
                            let cost = REVIVE_SCHEDULE[Math.min(gameState.reviveCount, REVIVE_SCHEDULE.length - 1)];
                            document.getElementById('revive-cost').innerText = cost;
                            showScreen('screen-gameover');
                            submitScore(gameState.score, gameState.coins);
                        }
                    }

                    if (obs.position.z > 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        spawnRow(-300);
                    }
                }

                for (let i = coins.length - 1; i >= 0; i--) {
                    let c = coins[i];
                    c.position.z += gameSpeed;
                    c.rotation.y += 0.05;

                    if (Math.abs(c.position.z - playerGroup.position.z) < 0.8 && Math.round(c.position.x / laneWidth) === playerLane) {
                        gameState.coins += 1;
                        localStorage.setItem('sekato_coins', gameState.coins);
                        playTone(800, 'sine', 0.1);
                        scene.remove(c);
                        coins.splice(i, 1);
                    } else if (c.position.z > 10) {
                        scene.remove(c);
                        coins.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
